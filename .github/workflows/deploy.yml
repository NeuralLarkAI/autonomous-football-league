name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/afl-season-zero-scaffold-VqBV0
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Prepare static publish dir
        run: |
          mkdir -p apps/web/out
          touch apps/web/out/.nojekyll
          if [ ! -f apps/web/out/index.html ]; then
            cat > apps/web/out/index.html << 'EOF'
            <!doctype html>
            <html lang="en">
              <head>
                <meta charset="utf-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1" />
                <title>Autonomous Football League</title>
              </head>
              <body>
                <h1>Deploy completed, but no static export was generated.</h1>
                <p>This app currently uses Next.js server features (API routes) and is not a pure static export.</p>
              </body>
            </html>
            EOF
          fi

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/out
          force_orphan: true
