[build]
builder = "NIXPACKS"
buildCommand = "corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm build"

[deploy]
startCommand = "if [ \"${DATABASE_URL#file:}\" = \"$DATABASE_URL\" ]; then export DATABASE_URL=\"file:/app/packages/db/dev.db\"; fi; corepack pnpm --filter @afl/db prisma:generate && corepack pnpm --filter @afl/db prisma:migrate:deploy && if [ \"$SERVICE_ROLE\" = \"worker\" ]; then corepack pnpm start:worker; else corepack pnpm start:web; fi"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
